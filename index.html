<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ร้านดอกไม้</title>
    <!-- CSS และสไตล์ต่างๆ ของเว็บไซต์ -->
</head>
<body>

    <!-- เนื้อหาหน้าเว็บ หรือส่วนแสดงรายการสินค้าดอกไม้ -->
    <div id="product-list">
        <!-- รายการสินค้าจะถูกแสดงตรงนี้ -->
    </div>

    <!-- สคริปต์แชทบอท Animuz ของคุณ -->
    <script defer
      data-embed-id="2caac7ec-67b8-4c84-91b3-36255b1daef2"
      data-open-on-load="off"
      ...
      src="https://cdn.jsdelivr.net/npm/@animuz/embed@0.2.9/dist/animuz-chat-widget.min.js">
    </script>

    <!-- ⬇️ นำโค้ดดึงข้อมูล Google Sheets มาวางไว้ตรงนี้ ⬇️ -->
    <script>
      // แทนที่ลิงก์ด้านล่างด้วย Web App URL ที่ได้จากการ Deploy บน Google Apps Script ของคุณ
      const apiUrl = "https://script.google.com/macros/s/AKfycbzJyaJYcD_9arSPyXDH3ALQX68KnZINwiTYOu7rjK4WLmoc8Gwd75Ed_uYn0TdY9ZMW/exec";

      fetch(apiUrl)
        .then(response => response.json())
        .then(products => {
          console.log("ข้อมูลสินค้าจาก Google Sheets:", products);
          
          // ตัวอย่าง: นำข้อมูลสินค้าไปแสดงผลบนหน้าเว็บ
          // คุณสามารถเขียนโค้ด JavaScript วนลูป (เช่น products.forEach) เพื่อสร้างการ์ดสินค้าดอกไม้ตรงนี้ได้เลยครับ
        })
        .catch(error => console.error("Error fetching data:", error));
    </script>

</body>
</html>

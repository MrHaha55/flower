<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านดอกไม้ - Handmade Velvet Flowers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-rose-50/30 text-gray-800 antialiased min-h-screen flex flex-col p-6">

    <header class="max-w-4xl mx-auto w-full mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-900">🌸 ร้านดอกไม้ลวดกำมะหยี่</h1>
        <p class="text-sm text-gray-500 mt-1">ข้อมูลดึงสดจาก Google Sheets อัตโนมัติ</p>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1">
        <!-- กล่องแสดงรายการสินค้า -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- สินค้าจะถูกดึงมาแสดงตรงนี้ -->
        </div>
    </main>

    <script>
        let products = [];

        // ลิงก์ Web App ของคุณ
        const apiUrl = "https://script.google.com/macros/s/AKfycbzJyaJYcD_9arSPyXDH3ALQX68KnZINwiTYOu7rjK4WLmoc8Gwd75Ed_uYn0TdY9ZMW/exec";

        window.addEventListener('DOMContentLoaded', () => {
            fetchSheetData();
        });

        // 1. ฟังก์ชันดึงข้อมูลจาก Google Sheets
        function fetchSheetData() {
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    products = data.map((item, idx) => ({
                        id: idx + 1,
                        name: item["ชื่อดอกไม้"] || "ดอกไม้",
                        color: item["รายละเอียดสี"] || "-",
                        price: Number(item["ราคา (บาท)"]) || 0,
                        stock: Number(item["จำนวนในสต็อก (ชิ้น)"]) || 0
                    }));
                    
                    // เรียกใช้งานฟังก์ชัน renderProducts ที่เคยแจ้งเตือนว่าหายไป
                    renderProducts();
                })
                .catch(error => console.error("Error fetching data:", error));
        }

        // 2. ฟังก์ชันสร้างหน้าตา HTML สำหรับแสดงสินค้า (แก้ปัญหา Error renderProducts is not defined)
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = "";

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-rose-100 shadow-sm flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <span class="text-xs bg-rose-50 text-rose-600 px-2 py-0.5 rounded-full font-medium">สี: ${product.color}</span>
                        <h3 class="font-bold text-gray-900 text-lg mt-2">${product.name}</h3>
                        <p class="text-xs text-gray-500 mt-1">คงเหลือ: ${product.stock} ชิ้น</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                        <span class="text-rose-600 font-extrabold text-lg">฿${product.price}</span>
                        <button onclick="alert('เลือกซื้อ: ${product.name}')" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-3 py-2 rounded-xl font-medium">เลือกซื้อ</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
